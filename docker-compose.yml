version: '3.8'

services:
  theguptas-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: theguptas-web
    restart: unless-stopped
    ports:
      # Binds to localhost only so your host Nginx / Caddy / Traefik can safely reverse proxy it
      - "127.0.0.1:${PORT:-8086}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: theguptas-network
