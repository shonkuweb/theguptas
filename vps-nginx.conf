# ==========================================================================
# Nginx Reverse Proxy Configuration for theguptas.shonku.site
# Place this file on your VPS at: /etc/nginx/sites-available/theguptas.shonku.site
# Symlink: sudo ln -s /etc/nginx/sites-available/theguptas.shonku.site /etc/nginx/sites-enabled/
# ==========================================================================

server {
    listen 80;
    server_name theguptas.shonku.site;

    # Redirect HTTP to HTTPS (certbot will auto-configure this)
    location / {
        proxy_pass http://127.0.0.1:9445;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
